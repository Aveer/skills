name: Skills validation
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate skill metadata and provenance
        shell: powershell
        run: |
          python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check-repository.py
      - name: Test mirror behavior on Windows PowerShell
        shell: powershell
        run: .\tests\test-mirror-skills.ps1
